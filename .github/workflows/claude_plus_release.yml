name: claude_plus_release
on:
  push:
    branches:
    - claude-plus
    paths:
    - .github/claude-plus/VERSION
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false
      artifacts_run_id:
        description: Publish the artifacts of this earlier run instead of building
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: claude-plus-release
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: '1'
jobs:
  bundle_windows_x86_64:
    if: inputs.artifacts_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
    - name: Enable long paths
      run: git config --system core.longpaths true
      shell: pwsh
    - name: Checkout
      uses: actions/checkout@v4
    - name: Read version
      id: version
      run: |
        $version = (Get-Content .github/claude-plus/VERSION -Raw).Trim()
        "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Expose Visual Studio at the path the bundle script expects
      run: |
        $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $expected = "C:\Program Files\Microsoft Visual Studio\2022\Community"
        if (-not (Test-Path $expected)) {
          New-Item -ItemType Junction -Path $expected -Target $installPath | Out-Null
        }
      shell: pwsh
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-registry-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-registry-
    - name: Bundle
      run: script/bundle-windows.ps1 -Architecture x86_64
      shell: pwsh
      env:
        CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        ZED_CLAUDE_PLUS_VERSION: ${{ steps.version.outputs.version }}
    - name: Rename installer
      run: |
        Move-Item target/Zed-x86_64.exe "target/Zed-Claude-Code-Plus-${{ steps.version.outputs.version }}-x86_64.exe"
      shell: pwsh
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Zed-Claude-Code-Plus-${{ steps.version.outputs.version }}-x86_64
        path: target/Zed-Claude-Code-Plus-${{ steps.version.outputs.version }}-x86_64.exe
        if-no-files-found: error
    - name: Upload remote server
      uses: actions/upload-artifact@v4
      with:
        name: zed-remote-server-windows-x86_64
        path: target/zed-remote-server-windows-x86_64.zip
        if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}
  publish_release:
    needs: bundle_windows_x86_64
    if: always() && (needs.bundle_windows_x86_64.result == 'success' || (needs.bundle_windows_x86_64.result == 'skipped' && inputs.artifacts_run_id != '')) && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout installer script
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          script/claude-plus
          .github/claude-plus
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
        run-id: ${{ inputs.artifacts_run_id || github.run_id }}
        github-token: ${{ github.token }}
    - name: Add installer script
      run: cp script/claude-plus/install.cmd dist/install-zed-claude-code-plus.cmd
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(tr -d '[:space:]' < .github/claude-plus/VERSION)
        ls -la dist
        cat > notes.md <<NOTES
        Zed ${VERSION%%-plus*} with Claude Code Plus additions, built from \`${GITHUB_SHA::7}\`.

        ### Install (Windows 11, x64)
        1. Download \`install-zed-claude-code-plus.cmd\` once and double-click it. It uses the GitHub CLI (\`gh\`) to download and install the latest release, so running it again later updates Zed. Alternatively, download \`Zed-Claude-Code-Plus-${VERSION}-x86_64.exe\` and run it.
        2. The installer replaces the official Zed and keeps your settings, extensions and threads. It is unsigned, so SmartScreen may warn when you run a downloaded file: choose **More info → Run anyway**.
        3. From 1.25.2-plus.3 on, Zed updates itself from this repository's releases instead of the official ones. If your settings.json still has \`"auto_update": false\` from an earlier build, remove it to turn updates on.

        ### Additions
        - Editing previous messages for agents that advertise \`claudeCodePlus\` truncate support (claude-agent-acp-plus 0.94.0-plus.6+).
        - \`agent.wrap_terminal_commands\` setting and a hover button on command blocks to toggle wrapping.
        - Auto-updates from this repository's releases.
        - Shows plan usage limits (session and weekly) in the context usage tooltip, with claude-agent-acp-plus 0.94.0-plus.10 or later.
        - \`/clear\`, \`/reset\` and \`/new\` open a new thread for the same agent when it advertises \`newThreadCommands\` (claude-agent-acp-plus 0.94.0-plus.8+).
        NOTES
        if ! output=$(gh release create "v${VERSION}" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "Zed Claude Code Plus ${VERSION}" \
          --notes-file notes.md 2>&1); then
          echo "$output"
          echo "::error title=gh release create failed::${output//$'\n'/%0A}"
          exit 1
        fi
        echo "$output"
